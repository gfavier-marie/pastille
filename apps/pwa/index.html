<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pastille" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Pastille</title>
    <style>
      :root { font: 17px/1.3 -apple-system, system-ui, sans-serif; color: #18181b; --pin: #e5484d; }
      * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f4f5; overscroll-behavior: none; }
      body { display: grid; grid-template-rows: auto 1fr auto; height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #fff; border-bottom: 1px solid #e4e4e7; min-height: 52px; }
      #focus { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #focus b { color: var(--pin); }
      #dot { width: 12px; height: 12px; border-radius: 6px; background: #a1a1aa; flex: none; }
      #dot.on { background: #1a7f37; }
      #board { position: relative; touch-action: none; overflow: hidden; }
      #board canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
      nav { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #fff; border-top: 1px solid #e4e4e7; overflow-x: auto; }
      nav button { min-width: 48px; min-height: 48px; padding: 0 12px; font: inherit; border: 1px solid #d4d4d8; border-radius: 12px; background: #fff; color: inherit; flex: none; }
      nav button[aria-pressed="true"] { border-color: #18181b; box-shadow: inset 0 0 0 2px #18181b; }
      nav button.color { padding: 0; }
      nav button.color i { display: inline-block; width: 24px; height: 24px; border-radius: 12px; vertical-align: middle; }
      nav button:disabled { opacity: 0.4; }
      nav .sep { width: 1px; align-self: stretch; background: #e4e4e7; flex: none; }
      #send { margin-left: auto; min-width: 140px; background: var(--pin); color: #fff; border: 0; font-weight: 600; }
      #toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); background: #18181b; color: #fff; padding: 10px 16px; border-radius: 10px; display: none; }
    </style>
  </head>
  <body>
    <header>
      <span id="dot"></span>
      <span id="focus">Connexion…</span>
    </header>
    <div id="board"><canvas id="bg"></canvas><canvas id="ink"></canvas></div>
    <nav>
      <button data-tool="pen" aria-pressed="true">Stylo</button>
      <button class="color" data-color="#18181b" aria-label="Noir" aria-pressed="true"><i style="background:#18181b"></i></button>
      <button class="color" data-color="#e5484d" aria-label="Rouge"><i style="background:#e5484d"></i></button>
      <button class="color" data-color="#0a84ff" aria-label="Bleu"><i style="background:#0a84ff"></i></button>
      <button data-size="4" aria-pressed="true">Fin</button>
      <button data-size="10">Épais</button>
      <button data-tool="eraser">Gomme</button>
      <span class="sep"></span>
      <button id="undo">Annuler</button>
      <button id="clear">Effacer</button>
      <button id="background">Fond : blanc</button>
      <button id="send" disabled>Envoyer</button>
    </nav>
    <div id="toast"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
