# Installeurs : .dmg (macOS) et .exe (Windows). whisper-server est embarqué ;
# le modèle (547 Mo) est téléchargé au premier lancement.
appId: fr.pastille.desktop
productName: VibeScreener
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - resources/**
  - fixtures/**
  - package.json
extraResources:
  - from: ../../vendor/whisper
    to: whisper
asarUnpack:
  - '**/*.node'
  - '**/node_modules/get-windows/main'
npmRebuild: false
mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.developer-tools
  # Pas de compte Apple Developer : signature ad hoc (sans elle, macOS dit « endommagé »
  # pour une app téléchargée). install.sh évite l'alerte Gatekeeper.
  identity: '-'
  hardenedRuntime: false
  artifactName: ${productName}-${arch}.${ext} # lien stable : releases/latest/download/VibeScreener-arm64.dmg
  extendInfo:
    LSUIElement: true # application de barre de menus, sans icône dans le Dock
    NSMicrophoneUsageDescription: VibeScreener utilise le micro pour dicter les commentaires.
win:
  target: nsis
  # Pas de certificat de signature : un .exe téléchargé par le navigateur déclenche SmartScreen
  # (« Informations complémentaires » > « Exécuter quand même ») ; install.ps1 l'évite.
  artifactName: ${productName}-Setup.${ext} # lien stable : releases/latest/download/VibeScreener-Setup.exe
nsis:
  oneClick: true # installation pour l'utilisateur, sans droits administrateur, dans %LOCALAPPDATA%\Programs\VibeScreener
