<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>VibeScreener</title>
    <link rel="stylesheet" href="./theme.css" />
    <style>
      html, body, #root { height: 100%; background: transparent; overflow: hidden; user-select: none; pointer-events: none; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
      .feedback {
        position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
        display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; border-radius: 14px;
        background: rgba(28, 28, 30, 0.96); color: #f2f2f3;
        border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
        font-size: 13px; white-space: nowrap;
      }
      .feedback-head { display: flex; align-items: center; gap: 10px; }
      .feedback-head strong { font-weight: 600; }
      .rec-dot { width: 8px; height: 8px; border-radius: 999px; background: #ff453a; }
      .feedback-meta { display: flex; align-items: center; gap: 10px; color: #c7c7cc; font-size: 12px; }
      .feedback-meta time { font-variant-numeric: tabular-nums; }
      .wave { flex: 1; height: 22px; display: flex; align-items: center; gap: 3px; }
      .wave span { width: 3px; border-radius: 2px; background: #f2f2f3; transition: height 0.1s; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./video-feedback.tsx"></script>
  </body>
</html>
