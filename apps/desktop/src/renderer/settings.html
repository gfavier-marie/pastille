<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Réglages de Pastille</title>
    <style>
      :root { color-scheme: light dark; --border: #e4e4e7; --muted: #71717a; --accent: #0a84ff; font: 13px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; }
      @media (prefers-color-scheme: dark) { :root { --border: #3f3f46; --muted: #a1a1aa; } }
      body { margin: 0; }
      main { padding: 16px 24px 32px; max-width: 600px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
      section { border-top: 1px solid var(--border); padding: 14px 0; }
      section.first { border: 1px solid var(--accent); border-radius: 10px; padding: 14px; margin-bottom: 8px; }
      label { display: grid; gap: 4px; margin: 0 0 12px; }
      input, select, textarea { font: inherit; color: inherit; background: transparent; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; }
      textarea { resize: vertical; }
      .inline { display: flex; gap: 8px; } .inline input { flex: 1; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 10px; min-height: 30px; }
      button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: inherit; cursor: pointer; }
      .primary { background: var(--accent); color: #fff; border: 0; padding: 7px 16px; }
      .ok { color: #1a7f37; } .todo { color: inherit; }
      .error { color: #b42318; }
      .hint { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
      .shortcut { font-weight: 600; text-align: center; cursor: pointer; }
      progress { width: 160px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./settings/settings.tsx"></script>
  </body>
</html>
