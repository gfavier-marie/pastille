<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" />
    <title>VibeScreener</title>
    <link rel="stylesheet" href="./theme.css" />
    <style>
      html, body, #root { height: 100%; background: var(--bg); }
      .pairing { height: 100%; display: flex; flex-direction: column; }
      .main { flex: 1; padding: 24px 36px 0; display: grid; grid-template-columns: 256px minmax(0, 1fr); gap: 36px; align-items: start; }
      .code { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .qr { position: relative; width: 256px; height: 256px; padding: 24px; border-radius: 18px; border: 1px solid #e6e6ea; background: #fff; box-shadow: 0 6px 20px rgba(20, 22, 30, 0.08); }
      .qr img { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
      .qr .logo { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; transform: translate(-50%, -50%); border-radius: 12px; background: #fff; display: flex; align-items: center; justify-content: center; }
      .status { display: flex; align-items: center; gap: 8px; color: var(--muted); }
      .status.ok { color: var(--success-text); font-weight: 600; }
      .steps { display: flex; flex-direction: column; gap: 18px; padding-top: 4px; }
      h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
      ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; }
      ol li { display: flex; gap: 12px; align-items: flex-start; }
      ol li span:last-child { line-height: 1.45; padding-top: 2px; }
      .devices { flex: none; margin: 18px 36px 22px; display: flex; flex-direction: column; gap: 8px; }
      .devices h2 { margin-left: 2px; font-size: 12px; font-weight: 600; color: var(--muted); }
      .device { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 14px; border: 1px solid #e6e6ea; border-radius: 10px; }
      .device .what { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
      .device .what b { font-weight: 600; }
      .device .what small { font-size: 12px; color: var(--muted); }
      .device .online { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./pairing/pairing.tsx"></script>
  </body>
</html>
