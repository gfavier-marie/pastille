packages:
  - apps/*
  - packages/*

# electron-builder et les modules natifs préfèrent un node_modules à plat.
nodeLinker: hoisted

allowBuilds:
  electron: false # le binaire est téléchargé au premier lancement
  electron-winstaller: false # Squirrel, inutile (installeur NSIS)
  esbuild: true
  get-windows: true
  uiohook-napi: false # binaires précompilés fournis (prebuilds), rien à compiler
  workerd: true

minimumReleaseAgeExclude:
  - vite@7.3.7
  - '@cloudflare/workers-types@5.20261006.1'
