# Vérifications de chaque push sous Linux (dépôt bientôt privé : une minute macOS compte 10, Windows 2).
# « Construire les installeurs » et chaque tag v* construisent le .dmg et le .exe, et installent et
# testent l'app sur le runner Windows. Un tag v* (git tag v0.8.0 && git push --tags) les publie sur le
# bucket R2 des téléchargements, et dans une Release GitHub pour les apps ≤ 0.7.0, qui la lisent encore.
# Déploiement Cloudflare (relais, site, R2) : secret CLOUDFLARE_API_TOKEN et variable CLOUDFLARE_ACCOUNT_ID.
name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      bench:
        description: 'Mesurer aussi la transcription (télécharge le modèle, 547 Mo)'
        type: boolean
        default: false
      dist:
        description: 'Construire les installeurs (.dmg et .exe)'
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @pastille/desktop build

  # Relais (+ PWA) et site, à chaque push sur main, une fois Cloudflare configuré.
  deploy:
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm relay:deploy && pnpm site:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  bench-windows:
    if: ${{ inputs.bench }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: models
          key: whisper-large-v3-turbo-q5_0
      - run: pnpm setup:whisper
      - run: pnpm bench:dictee

  dist:
    if: ${{ inputs.dist || startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Windows : le modèle sert au test de l'app installée (il n'est pas dans l'installeur).
      - if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: models
          key: whisper-large-v3-turbo-q5_0
      - if: runner.os == 'Windows'
        run: pnpm setup:whisper
      - if: runner.os == 'macOS'
        run: pnpm build:whisper-mac
      - run: pnpm dist
      # Windows : installé par install.ps1 comme chez un utilisateur (depuis le fichier construit),
      # puis l'app installée doit démarrer, passer le test de bout en bout et faire une vraie capture.
      - if: runner.os == 'Windows'
        name: install.ps1
        shell: powershell
        run: |
          $env:PASTILLE_EXE_URL = ([uri](Resolve-Path apps\desktop\dist\VibeScreener-Setup.exe).Path).AbsoluteUri
          Get-Content install.ps1 -Raw -Encoding UTF8 | Invoke-Expression
          Start-Sleep 15
          Get-Process VibeScreener | Format-Table Id, StartTime # échoue si l'app s'est arrêtée au démarrage
          Get-ChildItem "$env:LOCALAPPDATA\Programs\vibescreener\resources\whisper" -Filter *.dll | Format-Wide Name -Column 4
          & "$env:LOCALAPPDATA\Programs\vibescreener\VibeScreener.exe" --quit
          Wait-Process VibeScreener -Timeout 15
      - if: runner.os == 'Windows'
        name: e2e (app installée)
        run: |
          $env:PASTILLE_E2E_APP = "$env:LOCALAPPDATA\Programs\vibescreener\VibeScreener.exe"
          $env:PASTILLE_FAKE_AUDIO = "$PWD\apps\desktop\fixtures\dictee-fr.wav"
          $env:PASTILLE_WHISPER_MODEL = "$PWD\models\ggml-large-v3-turbo-q5_0.bin"
          $env:TEMP = (New-Item -ItemType Directory -Force e2e-output\tmp).FullName # sessions et exports gardés avec les photos
          node scripts/e2e.ts
      - if: runner.os == 'Windows'
        name: Capture (app installée)
        timeout-minutes: 3
        run: |
          Start-Process notepad
          Start-Sleep 3
          $env:PASTILLE_AUTOTEST = 'capture'
          $env:TEMP = (New-Item -ItemType Directory -Force e2e-output\capture).FullName
          $log = & "$env:LOCALAPPDATA\Programs\vibescreener\VibeScreener.exe" | Out-String
          $log
          if (([regex]::Matches($log, 'CAPTURE \{"ok":true')).Count -ne 5) { throw '5 captures attendues' }
      - if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-Windows
          path: e2e-output
      - uses: actions/upload-artifact@v4
        with:
          name: vibescreener-${{ runner.os }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe

  # Publication quand les deux installeurs sont construits (et l'app Windows testée) : les installeurs
  # (versionnés, et les derniers pour le site), les scripts d'installation, puis latest.json en dernier,
  # sans cache : l'app ne voit la nouvelle version qu'une fois tout en ligne.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: vibescreener-*
          merge-multiple: true
          path: dist
      - run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$v" = "$(node -p "require('./apps/desktop/package.json').version")" ] || { echo "Le tag $GITHUB_REF_NAME ne correspond pas à la version de apps/desktop/package.json" >&2; exit 1; }
          put() { pnpm exec wrangler r2 object put "vibescreener-downloads/$1" --file "$2" --remote --cache-control "$3"; }
          for f in VibeScreener-arm64.dmg VibeScreener-Setup.exe; do
            put "v$v/$f" "dist/$f" "public, max-age=31536000, immutable"
            put "$f" "dist/$f" "public, max-age=300"
          done
          put install.sh install.sh "public, max-age=300"
          put install.ps1 install.ps1 "public, max-age=300"
          printf '{"version":"%s"}\n' "$v" > latest.json
          put latest.json latest.json "no-cache"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  # Release GitHub : seules les apps ≤ 0.7.0 la lisent encore pour se mettre à jour (dépôt public).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dist
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vibescreener-*
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" VibeScreener-arm64.dmg VibeScreener-Setup.exe --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
